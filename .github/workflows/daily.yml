name: daily-costco

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 한국시간 오전 6시
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install requests beautifulsoup4 pillow

      - name: 크롤링 실행
        run: python crawl.py

      - name: 결과 저장
        run: |
          git config user.name "costco-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "daily update"
          git push
